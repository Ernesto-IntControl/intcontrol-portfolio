  <!-- Applique le thème avant le premier rendu pour éviter le flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        // L'écran d'attente n'apparaît que si le site met plus de 350 ms à démarrer
        setTimeout(function () { document.documentElement.classList.add("boot-show"); }, 350);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute("content", t === "dark" ? "#07090c" : "#f4f5f7");
        });
      } catch (e) { }
    })();
  </script>

    #boot svg { width: 52px; height: 52px; overflow: visible; }
    #boot path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 1.5s cubic-bezier(.65, 0, .35, 1) infinite alternate; }
    #boot .c { stroke: #34d6c8; animation-delay: .2s; }
    html[data-theme="light"] #boot .c { stroke: #0b8a80; }
    @keyframes boot-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot path { animation: none; stroke-dashoffset: 0; } }
  </style>
